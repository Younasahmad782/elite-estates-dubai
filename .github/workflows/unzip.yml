name: Unzip site files
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract site files
        run: |
          if [ -f elite-estates-dubai.zip ]; then
            unzip -o elite-estates-dubai.zip
            mv elite-estates/* .
            rmdir elite-estates
            rm -f render.py
            rm elite-estates-dubai.zip
          fi
      - name: Commit extracted files
        run: |
          git config user.name "Younasahmad782"
          git config user.email "Younasahmad782@users.noreply.github.com"
          git add -A
          git commit -m "Add Elite Estates Dubai site files" || echo "nothing to commit"
          git push
